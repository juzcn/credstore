name: Publish to PyPI

# Publishing is driven by a tag whose version matches pyproject.toml:
#
#   v0.10.6  ->  credstore 0.10.6
#
# The version in pyproject.toml must equal the tag version; the workflow
# fails otherwise.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v$VERSION != credstore version $PKG_VERSION"
            exit 1
          fi
          echo "credstore $PKG_VERSION — OK"

      - name: Install build tools
        # twine>=6 is required for trusted publishing (OIDC); <8 keeps the
        # range bounded.  The lower bound is what matters for metadata:
        # twine < 7 rejects Metadata-Version 2.5 ("'2.5' is not a valid
        # metadata version", verified 2026-09), so 6.x in this range only
        # works because pyproject.toml pins hatchling below 1.27
        # (-> metadata 2.3).  Lifting that pin requires raising this floor
        # to >=7 in the same change.  (Not a pkginfo cap — twine >= 6.2 no
        # longer depends on pkginfo.)
        run: pip install 'build' 'twine>=6,<8'

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          retry_wait_seconds: 15
          command: twine upload --verbose dist/*
